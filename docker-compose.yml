version: '3.8'

services:
  # 后端应用
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_backend
    restart: unless-stopped
    ports:
      - "14726:14726"  # 修改为 14726 端口
    env_file:
      - .env
    # 使用 host 网络模式连接外部 PostgreSQL 和 Redis
    network_mode: host
    volumes:
      - ./data:/app/data  # 挂载数据目录（RAG 文档等）
      - ./logs:/app/logs  # 挂载日志目录
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:14726/"]
      interval: 30s
      timeout: 10s
      retries: 3