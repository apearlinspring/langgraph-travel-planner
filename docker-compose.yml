services:
  backend:
    image: langgraph-travel-planner-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhixing-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-staging}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      DEBUG: ${DEBUG:-false}
      SQL_ECHO: ${SQL_ECHO:-false}
      ZHIXING_PUBLIC_BASE_URL: ${ZHIXING_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      ZHIXING_EVAL_BASE_URL: ${ZHIXING_EVAL_BASE_URL:-http://127.0.0.1:8000}
      ZHIXING_BACKUP_DIR: ${ZHIXING_BACKUP_DIR:-/app/backups}
      ZHIXING_M1_AUDIENCE: ${ZHIXING_M1_AUDIENCE:-}
      ZHIXING_REAL_PAYMENT_ORDER_DISABLED: ${ZHIXING_REAL_PAYMENT_ORDER_DISABLED:-true}
      ZHIXING_SERVER_PROVIDER: ${ZHIXING_SERVER_PROVIDER:-}
      ZHIXING_SERVER_OS_VERSION: ${ZHIXING_SERVER_OS_VERSION:-}
      ZHIXING_SERVER_CPU_RAM_DISK: ${ZHIXING_SERVER_CPU_RAM_DISK:-}
      ZHIXING_DOMAIN_READY: ${ZHIXING_DOMAIN_READY:-false}
      ZHIXING_SERVER_EGRESS_IP_STATUS: ${ZHIXING_SERVER_EGRESS_IP_STATUS:-unknown}
      ZHIXING_DEPLOY_MODE: ${ZHIXING_DEPLOY_MODE:-}
      ZHIXING_DEPLOY_DIR: ${ZHIXING_DEPLOY_DIR:-}
      ZHIXING_DOCKER_STATUS: ${ZHIXING_DOCKER_STATUS:-}
      ZHIXING_SERVER_PORTS_STATUS: ${ZHIXING_SERVER_PORTS_STATUS:-}
      ZHIXING_TLS_STATUS: ${ZHIXING_TLS_STATUS:-}
      ZHIXING_REVERSE_PROXY_STATUS: ${ZHIXING_REVERSE_PROXY_STATUS:-}
      ZHIXING_POSTGRES_MODE: ${ZHIXING_POSTGRES_MODE:-}
      ZHIXING_REDIS_MODE: ${ZHIXING_REDIS_MODE:-}
      ZHIXING_SECRET_STORE: ${ZHIXING_SECRET_STORE:-}
      ZHIXING_SECRET_OWNER: ${ZHIXING_SECRET_OWNER:-}
      ZHIXING_SECRET_ROTATION_CADENCE: ${ZHIXING_SECRET_ROTATION_CADENCE:-}
      ZHIXING_LLM_PROVIDER_READY: ${ZHIXING_LLM_PROVIDER_READY:-false}
      ZHIXING_MAP_API_READY: ${ZHIXING_MAP_API_READY:-false}
      ZHIXING_OPTIONAL_EXTERNAL_APIS: ${ZHIXING_OPTIONAL_EXTERNAL_APIS:-none}
      ZHIXING_EXTERNAL_API_QUOTA_BUDGET: ${ZHIXING_EXTERNAL_API_QUOTA_BUDGET:-}
      ZHIXING_PROVIDER_CONSOLE_OWNER: ${ZHIXING_PROVIDER_CONSOLE_OWNER:-}
      ZHIXING_PROVIDER_SUPPORT_CHANNEL: ${ZHIXING_PROVIDER_SUPPORT_CHANNEL:-}
      ZHIXING_EXTERNAL_API_DEGRADATION_POLICY: ${ZHIXING_EXTERNAL_API_DEGRADATION_POLICY:-}
      ZHIXING_EXTERNAL_API_TIMEOUT_RETRY_POLICY: ${ZHIXING_EXTERNAL_API_TIMEOUT_RETRY_POLICY:-}
      ZHIXING_TAVILY_SERVICE_STATUS: ${ZHIXING_TAVILY_SERVICE_STATUS:-}
      ZHIXING_VARIFLIGHT_SERVICE_STATUS: ${ZHIXING_VARIFLIGHT_SERVICE_STATUS:-}
      ZHIXING_AIGOHOTEL_SERVICE_STATUS: ${ZHIXING_AIGOHOTEL_SERVICE_STATUS:-}
      ZHIXING_12306_MCP_STATUS: ${ZHIXING_12306_MCP_STATUS:-}
      ZHIXING_DATA_SCOPE: ${ZHIXING_DATA_SCOPE:-}
      ZHIXING_ACCEPTANCE_WINDOW: ${ZHIXING_ACCEPTANCE_WINDOW:-}
      ZHIXING_EVAL_ACCOUNT_READY: ${ZHIXING_EVAL_ACCOUNT_READY:-false}
      ZHIXING_BACKUP_TARGET: ${ZHIXING_BACKUP_TARGET:-}
      ZHIXING_BACKUP_RETENTION: ${ZHIXING_BACKUP_RETENTION:-}
      ZHIXING_RAG_RESTORE_STRATEGY: ${ZHIXING_RAG_RESTORE_STRATEGY:-}
      ZHIXING_POSTGRES_BACKUP_STATUS: ${ZHIXING_POSTGRES_BACKUP_STATUS:-}
      ZHIXING_POSTGRES_RESTORE_DRILL_STATUS: ${ZHIXING_POSTGRES_RESTORE_DRILL_STATUS:-}
      ZHIXING_RAG_RESTORE_DRILL_STATUS: ${ZHIXING_RAG_RESTORE_DRILL_STATUS:-}
      ZHIXING_RESTORE_DRILL_OWNER: ${ZHIXING_RESTORE_DRILL_OWNER:-}
      ZHIXING_ACCEPTABLE_DATA_LOSS: ${ZHIXING_ACCEPTABLE_DATA_LOSS:-}
      ZHIXING_MONITORING_PROVIDER: ${ZHIXING_MONITORING_PROVIDER:-}
      ZHIXING_ALERT_CHANNEL: ${ZHIXING_ALERT_CHANNEL:-}
      ZHIXING_DAILY_COST_BUDGET: ${ZHIXING_DAILY_COST_BUDGET:-}
      ZHIXING_HEALTH_ALERT_DELIVERY_STATUS: ${ZHIXING_HEALTH_ALERT_DELIVERY_STATUS:-}
      ZHIXING_READINESS_ALERT_DELIVERY_STATUS: ${ZHIXING_READINESS_ALERT_DELIVERY_STATUS:-}
      ZHIXING_ALERT_DRILL_OWNER: ${ZHIXING_ALERT_DRILL_OWNER:-}
      ZHIXING_ALERT_DRILL_WINDOW: ${ZHIXING_ALERT_DRILL_WINDOW:-}
      ZHIXING_ERROR_RATE_MONITOR_STATUS: ${ZHIXING_ERROR_RATE_MONITOR_STATUS:-}
      ZHIXING_P95_LATENCY_MONITOR_STATUS: ${ZHIXING_P95_LATENCY_MONITOR_STATUS:-}
      ZHIXING_TOOL_FAILURE_MONITOR_STATUS: ${ZHIXING_TOOL_FAILURE_MONITOR_STATUS:-}
      ZHIXING_COST_ALERT_STATUS: ${ZHIXING_COST_ALERT_STATUS:-}
      ZHIXING_BACKUP_ALERT_STATUS: ${ZHIXING_BACKUP_ALERT_STATUS:-}
      ZHIXING_LOG_REDACTION_SAMPLE_STATUS: ${ZHIXING_LOG_REDACTION_SAMPLE_STATUS:-}
      ZHIXING_ROLLBACK_OWNER: ${ZHIXING_ROLLBACK_OWNER:-}
      ZHIXING_INCIDENT_OWNER: ${ZHIXING_INCIDENT_OWNER:-}
      ZHIXING_ROLLBACK_DRILL_STATUS: ${ZHIXING_ROLLBACK_DRILL_STATUS:-}
      ZHIXING_ROLLBACK_TARGET_STATUS: ${ZHIXING_ROLLBACK_TARGET_STATUS:-}
      ZHIXING_POST_ROLLBACK_HEALTH_STATUS: ${ZHIXING_POST_ROLLBACK_HEALTH_STATUS:-}
      ZHIXING_POST_ROLLBACK_SMOKE_STATUS: ${ZHIXING_POST_ROLLBACK_SMOKE_STATUS:-}
      ZHIXING_ROLLBACK_DATA_SAFETY_STATUS: ${ZHIXING_ROLLBACK_DATA_SAFETY_STATUS:-}
      ZHIXING_INCIDENT_RESPONSE_STATUS: ${ZHIXING_INCIDENT_RESPONSE_STATUS:-}
      ZHIXING_INCIDENT_REVIEW_STATUS: ${ZHIXING_INCIDENT_REVIEW_STATUS:-}
      ZHIXING_INCIDENT_SEVERITY_POLICY_STATUS: ${ZHIXING_INCIDENT_SEVERITY_POLICY_STATUS:-}
      ZHIXING_INCIDENT_COMMUNICATION_STATUS: ${ZHIXING_INCIDENT_COMMUNICATION_STATUS:-}
      ZHIXING_LEAK_RESPONSE_OWNER: ${ZHIXING_LEAK_RESPONSE_OWNER:-}
      ZHIXING_JWT_SECRET_STATUS: ${ZHIXING_JWT_SECRET_STATUS:-}
      ZHIXING_PROVIDER_KEY_STATUS: ${ZHIXING_PROVIDER_KEY_STATUS:-}
      ZHIXING_DATABASE_SECRET_STATUS: ${ZHIXING_DATABASE_SECRET_STATUS:-}
      ZHIXING_REDIS_SECRET_STATUS: ${ZHIXING_REDIS_SECRET_STATUS:-}
      ZHIXING_ALLOWED_ORIGINS_STATUS: ${ZHIXING_ALLOWED_ORIGINS_STATUS:-}
      RUNTIME_STARTUP_DEPENDENCY_TIMEOUT_SECONDS: ${RUNTIME_STARTUP_DEPENDENCY_TIMEOUT_SECONDS:-12}
      RUNTIME_MCP_STARTUP_TIMEOUT_SECONDS: ${RUNTIME_MCP_STARTUP_TIMEOUT_SECONDS:-25}
      RUNTIME_MCP_OPTIONAL_STARTUP_TIMEOUT_SECONDS: ${RUNTIME_MCP_OPTIONAL_STARTUP_TIMEOUT_SECONDS:-25}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_MODEL_NAME: ${QWEN_MODEL_NAME:-qwen3.6-plus}
      QWEN_PLANNER_MODEL_NAME: ${QWEN_PLANNER_MODEL_NAME:-qwen3.6-plus}
      QWEN_ROUTER_MODEL_NAME: ${QWEN_ROUTER_MODEL_NAME:-qwen3.6-flash}
      QWEN_RAG_MODEL_NAME: ${QWEN_RAG_MODEL_NAME:-qwen3.6-flash}
      QWEN_VISION_MODEL_NAME: ${QWEN_VISION_MODEL_NAME:-qwen3.6-plus}
      QWEN_REPORT_MODEL_NAME: ${QWEN_REPORT_MODEL_NAME:-qwen3.6-plus}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_REQUEST_TIMEOUT_SECONDS: ${QWEN_REQUEST_TIMEOUT_SECONDS:-180}
      QWEN_MAX_RETRIES: ${QWEN_MAX_RETRIES:-1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-travel_planner_db}
      POSTGRES_USER: ${POSTGRES_USER:-travel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      POSTGRES_POOL_TIMEOUT_SECONDS: ${POSTGRES_POOL_TIMEOUT_SECONDS:-5}
      POSTGRES_STATEMENT_TIMEOUT_SECONDS: ${POSTGRES_STATEMENT_TIMEOUT_SECONDS:-10}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SESSION_LOCK_BACKEND: ${SESSION_LOCK_BACKEND:-redis}
      SESSION_LOCK_REDIS_FALLBACK_TO_LOCAL: ${SESSION_LOCK_REDIS_FALLBACK_TO_LOCAL:-false}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_BACKEND: ${API_RATE_LIMIT_BACKEND:-redis}
      API_RATE_LIMIT_REQUESTS_PER_WINDOW: ${API_RATE_LIMIT_REQUESTS_PER_WINDOW:-120}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      API_RATE_LIMIT_LOCAL_FALLBACK: ${API_RATE_LIMIT_LOCAL_FALLBACK:-false}
      RAG_VECTORSTORE_PATH: ${RAG_VECTORSTORE_PATH:-data/vectorstore}
      RAG_COLLECTION_NAME: ${RAG_COLLECTION_NAME:-travel_guides}
      RAG_INTERNAL_VECTORSTORE_PATH: ${RAG_INTERNAL_VECTORSTORE_PATH:-data/vectorstore_internal}
      RAG_INTERNAL_COLLECTION_NAME: ${RAG_INTERNAL_COLLECTION_NAME:-agency_internal_knowledge}
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      VARIFLIGHT_API_KEY: ${VARIFLIGHT_API_KEY:-}
      AIGOHOTEL_API_KEY: ${AIGOHOTEL_API_KEY:-}
      AIGOHOTEL_MCP_API: ${AIGOHOTEL_MCP_API:-}
      AIGOHOTEL_SECRET_KEY: ${AIGOHOTEL_SECRET_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-zhixing-travel-planner-prod}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      LANGGRAPH_RECURSION_LIMIT: ${LANGGRAPH_RECURSION_LIMIT:-60}
    volumes:
      - ${ZHIXING_SHARED_DATA_DIR:-./data}:/app/data
      - ${ZHIXING_SHARED_LOG_DIR:-./logs}:/app/logs
      - ${ZHIXING_SHARED_BACKUP_DIR:-./backups}:/app/backups
    ports:
      - "${BACKEND_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${APP_PORT:-8000}/health/ready >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg17
    container_name: zhixing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_planner_db}
      POSTGRES_USER: ${POSTGRES_USER:-travel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zhixing-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          redis-server --appendonly yes
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: zhixing-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZHIXING_SITE_ADDRESS: ${ZHIXING_SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
