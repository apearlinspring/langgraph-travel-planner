name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:
    inputs:
      acceptance_base_url:
        description: "Base URL for a running staging backend."
        required: false
        default: "https://travel.403edr.cn"
      run_live_acceptance:
        description: "Run live acceptance scenarios after preflight passes."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  APP_ENV: test
  DASHSCOPE_API_KEY: test-key-dashscope
  LANGSMITH_API_KEY: test-key-langsmith
  LANGSMITH_TRACING: "false"
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  JWT_SECRET_KEY: dev-only-ci-jwt-secret-change-me

jobs:
  ci:
    name: Static Checks And Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set Up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python Sources
        run: python -m compileall app tests scripts

      - name: Validate Internal RAG Knowledge
        run: python scripts/validate_rag_knowledge.py

      - name: Collect Pytest Suite
        run: python -m pytest --collect-only -q

      - name: Run Default Pytest Regression
        run: python -m pytest -q

      - name: Verify Frontend Report Renderer
        run: node scripts/verify_frontend_report_renderer.js

      - name: Check Development Runtime Readiness
        run: python scripts/check_runtime_readiness.py --target development --json

  acceptance-preflight:
    name: Manual Acceptance Preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: staging
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      REDIS_DB: ${{ secrets.REDIS_DB }}
      AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      VARIFLIGHT_API_KEY: ${{ secrets.VARIFLIGHT_API_KEY }}
      AIGOHOTEL_API_KEY: ${{ secrets.AIGOHOTEL_API_KEY }}
      AIGOHOTEL_MCP_API: ${{ secrets.AIGOHOTEL_MCP_API }}
      AIGOHOTEL_SECRET_KEY: ${{ secrets.AIGOHOTEL_SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Acceptance Preflight Only
        run: >
          python scripts/run_evaluation_scenarios.py
          --acceptance-core
          --preflight-only
          --base-url "${{ inputs.acceptance_base_url }}"
          --json

  live-acceptance:
    name: Manual Live Acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_acceptance
    needs:
      - acceptance-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APP_ENV: staging
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      REDIS_DB: ${{ secrets.REDIS_DB }}
      AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      VARIFLIGHT_API_KEY: ${{ secrets.VARIFLIGHT_API_KEY }}
      AIGOHOTEL_API_KEY: ${{ secrets.AIGOHOTEL_API_KEY }}
      AIGOHOTEL_MCP_API: ${{ secrets.AIGOHOTEL_MCP_API }}
      AIGOHOTEL_SECRET_KEY: ${{ secrets.AIGOHOTEL_SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256
      ZHIXING_EVAL_USERNAME: ${{ secrets.ZHIXING_EVAL_USERNAME }}
      ZHIXING_EVAL_PASSWORD: ${{ secrets.ZHIXING_EVAL_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Live Acceptance Scenarios
        run: >
          python scripts/run_evaluation_scenarios.py
          --acceptance-core
          --base-url "${{ inputs.acceptance_base_url }}"
          --summary-dir .runtime/acceptance
          --json
