name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  APP_ENV: test
  DASHSCOPE_API_KEY: test-key-dashscope
  LANGSMITH_API_KEY: test-key-langsmith
  LANGSMITH_TRACING: "false"
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  JWT_SECRET_KEY: dev-only-ci-jwt-secret-change-me

jobs:
  ci:
    name: Static Checks And Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set Up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Compile Python Sources
        run: python -m compileall app tests scripts

      - name: Validate Internal RAG Knowledge
        run: python scripts/validate_rag_knowledge.py

      - name: Collect Pytest Suite
        run: python -m pytest --collect-only -q

      - name: Validate Workflow Contracts
        run: python -m pytest tests/test_ci_workflows.py -q

      - name: Run Default Pytest Regression
        run: python -m pytest -q

      - name: Verify Frontend Report Renderer
        run: node scripts/verify_frontend_report_renderer.js

      - name: Verify Frontend Browser Regression
        env:
          ZHIXING_FRONTEND_BROWSER_STRICT: "1"
        run: npm run verify:frontend-browser

      - name: Check Development Runtime Readiness
        run: python scripts/check_runtime_readiness.py --target development --json
